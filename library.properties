sentence=Easy ADS1115 / ADS1015 16-bit ADC library: volts on 4 inputs, differential reads, automatic range, voltage dividers. No dependencies.
paragraph=Reads the ADS1115 or ADS1015 analog-to-digital converter over I2C with a one-line begin(): finds the address, gives voltage(channel) in volts, differential voltageDiff(), picks the most accurate range by itself, applies a voltage divider factor per input and explains wiring problems in Russian, Kazakh or English. Much more accurate than analogRead() and independent of Wi-Fi on ESP32. Needs only the built-in Wire library. Examples included, made for classes and kits by Alash Electronics.
